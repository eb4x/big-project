---
- name: configure dnsmasq on router
  hosts:
    - provisioner
    - uio-provisioner
  become: true

  pre_tasks:
    - name: install python packages
      delegate_to: localhost
      become: false
      pip:
        extra_args: '--user'
        name:
          - netaddr

    - name: Get service facts
      service_facts:
    - set_fact:
        firewalld_is_running: "{{ 'firewalld.service' in ansible_facts.services and
          ansible_facts.services['firewalld.service'].state == 'running' }}"

  tasks:
    - name: install dnsmasq
      package:
        name: dnsmasq

    - include_tasks: dnsmasq-tasks-okd.yml
    - include_tasks: dnsmasq-tasks-zabbix.yml

    - name: Open for business
      when: firewalld_is_running
      ansible.posix.firewalld:
        service: "{{ item.service }}"
        state: "{{ item.state | default('enabled') }}"
        immediate: true
        permanent: true
      loop:
        - service: dhcp
        - service: dhcpv6
          state: "{{ enable_ipv6 | default(false) | ternary('enabled', 'disabled') }}"
        - service: dns

    - name: Flush handlers
      meta: flush_handlers

    - name: ensure dnsmasq is running
      service:
        name: dnsmasq
        state: started

  handlers:
    - name: restart dnsmasq
      service:
        name: dnsmasq
        state: restarted

- name: install openshift tools to localhost
  hosts:
    - localhost
  tasks:
    - name: import okd-provisioner/get-release-version
      import_role:
        name: okd-provisioner
        tasks_from: get-release-version
    - name: import okd-provisioner/tools
      import_role:
        name: okd-provisioner
        tasks_from: tools

- name: setup okd baremetal provisioner
  hosts:
    - provisioner
    - uio-provisioner

  pre_tasks:
    - name: Get service facts
      service_facts:
    - set_fact:
        firewalld_is_running: "{{ 'firewalld.service' in ansible_facts.services and
          ansible_facts.services['firewalld.service'].state == 'running' }}"

  roles:
    - okd-provisioner

